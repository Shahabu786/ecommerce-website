spring.application.name=ecomm

# MySQL. Override without editing this file via env vars: DB_URL, DB_USERNAME, DB_PASSWORD
# (e.g. DB_URL=jdbc:mysql://localhost:3306/ecomm_db if your MySQL runs on the default port 3306).
# createDatabaseIfNotExist=true creates the ecomm_db database automatically on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:8080/ecomm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8484
server.error.include-message=always

# Fills an EMPTY database with demo categories + products on the first start
app.seed-demo-data=true
